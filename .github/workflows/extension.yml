name: Extension

# Builds the Chrome extension on every PR that touches it, and publishes a
# ready-to-install zip (manifest.json at the zip root) to a GitHub Release
# whenever a `v*` tag is pushed.
on:
  pull_request:
    paths:
      - 'apps/extension/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/extension.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      VITE_BACKEND_URL: http://localhost:5050
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm exec turbo run build --filter='!mapscan_api'

      - name: Check tag matches the extension version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          manifest_version=$(node -p "require('./apps/extension/dist/manifest.json').version")
          if [ "v${manifest_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version ${manifest_version} (apps/extension/packages/shared/config.ts)"
            exit 1
          fi

      - name: Package
        id: package
        run: |
          version=$(node -p "require('./apps/extension/dist/manifest.json').version")
          name="geoleadscraper-extension-v${version}.zip"
          (cd apps/extension/dist && zip -r -q "../../../${name}" . -x '*.map')
          unzip -l "${name}" | grep -q ' manifest.json$'
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.name }}
          generate_release_notes: true
          body: |
            ## Install
            1. Download **${{ steps.package.outputs.name }}** below (not "Source code").
            2. Unzip it.
            3. Open `chrome://extensions`, enable **Developer mode**, click **Load unpacked** and select the unzipped folder (the one that contains `manifest.json`).
